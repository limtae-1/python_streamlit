<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>경문고 Python 수업</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.31.0/build/stlite.css">
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.31.0/build/stlite.js"></script>
    <script>
      stlite.mount({
        requirements: [], // 필요한 패키지가 있다면 여기에 추가 (예: ["pandas", "numpy"])
        entrypoint: "app.py",
        files: {
          "app.py": {
            url: "./app.py",
          },
          "lecture_data.json": {
            url: "./lecture_data.json",
          },
        },
      }, document.getElementById("root"));
    </script>
  </body>
</html>
