<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>정보 수업 파이썬 실습실</title>

    <!-- stlite 스타일 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser/build/stlite.css" />

    <style>
      #error-log {
        display: none;
        background: #ffcccc;
        color: #cc0000;
        padding: 10px;
        border: 2px solid red;
        margin: 10px;
        white-space: pre-wrap;
        font-family: monospace;
        font-size: 12px;
        z-index: 9999;
        position: relative;
      }
    </style>

    <script>
      // 브라우저 에러를 화면에 표시
      window.onerror = function (message, source, lineno, colno, error) {
        var log = document.getElementById("error-log");
        if (log) {
          log.style.display = "block";
          log.textContent +=
            "Error: " + message + "\nLine: " + lineno + "\nSource: " + source + "\n\n";
        }
      };
      window.onunhandledrejection = function (event) {
        var log = document.getElementById("error-log");
        if (log) {
          log.style.display = "block";
          log.textContent += "Promise Error: " + event.reason + "\n\n";
        }
      };
    </script>
  </head>

  <body>
    <div id="error-log"></div>
    <div id="root"></div>

    <!-- ✅ @stlite/browser는 전역 stlite가 아니라 ESM import로 mount를 가져와야 함 -->
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser/build/stlite.js";

      // iOS 감지(필요 시 requirements 경량화에 사용)
      const isIOS =
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      // ============================
      // app.py (인라인)
      // ============================
      const APP_PY = String.raw`
import streamlit as st
import json
import sys
from io import StringIO
import os

st.set_page_config(layout="wide", page_title="정보 수업 파이썬 실습")

st.markdown("""
<style>
  .stTextArea textarea {
      background-color: #f0f2f6;
      font-family: 'Courier New', Courier, monospace;
      line-height: 1.5;
  }
  .output-box {
      background-color: #262730;
      color: #ffffff;
      padding: 10px;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      margin-top: 8px;
      margin-bottom: 10px;
      white-space: pre-wrap;
  }
</style>
""", unsafe_allow_html=True)

# ============================
# 유틸: 실행 / 출력 / 채점
# ============================
def normalize_output(s: str) -> str:
    return (s or "").replace("\\r\\n", "\\n").replace("\\r", "\\n").strip()

def run_user_code(user_code: str):
    old_stdout = sys.stdout
    redirected_output = StringIO()
    sys.stdout = redirected_output
    try:
        # 간단 실행(학생 실습용)
        exec(user_code, {})
        return {"ok": True, "output": redirected_output.getvalue(), "error": None}
    except Exception as e:
        return {"ok": False, "output": redirected_output.getvalue(), "error": str(e)}
    finally:
        sys.stdout = old_stdout

def render_output_box(output_text: str):
    text = output_text if output_text else "(출력 없음)"
    st.markdown(
        f"<div class='output-box'>{text.replace(chr(10), '<br>')}</div>",
        unsafe_allow_html=True
    )

# ============================
# JSON 로드
# ============================
def load_json(filepath):
    try:
        with open(filepath, 'r', encoding='utf-8') as f:
            return json.load(f)
    except Exception:
        return []

# ============================
# 사이드바 메뉴
# ============================
st.sidebar.title("🐍 정보 수업 실습실")
st.sidebar.header("학습 주제 선택")

menu_data = load_json("data/menu.json")

if not menu_data:
    st.sidebar.error("메뉴 데이터(data/menu.json)가 없습니다.")
else:
    menu_options = {item['title']: item for item in menu_data}
    selected_main_title = st.sidebar.selectbox("대단원 선택", list(menu_options.keys()))

    if selected_main_title:
        selected_file = menu_options[selected_main_title]['file']
        chapter_data = load_json(os.path.join("data", selected_file))

        if not chapter_data:
            st.error(f"{selected_file} 파일을 읽을 수 없습니다.")
        else:
            chapter_titles = [item['sub_title'] for item in chapter_data]
            selected_chapter_title = st.sidebar.selectbox("학습 내용 선택", chapter_titles)

            current_chapter = next((item for item in chapter_data if item['sub_title'] == selected_chapter_title), None)

            if current_chapter:
                st.header(f"📝 {current_chapter['sub_title']}")
                st.divider()

                blocks = current_chapter.get('blocks', [])

                for index, block in enumerate(blocks):
                    b_type = block.get('type', 'text')

                    # 1) 텍스트 블록
                    if b_type == 'text':
                        st.markdown(block.get('content', ''))

                    # 2) 일반 코드 블록 (세로형: 코드박스 → 실행버튼 → 결과)
                    elif b_type == 'code':
                        st.info(block.get('guide', '아래 코드를 실행해보세요.'))

                        key_base = f"code_{selected_chapter_title}_{index}"

                        user_code = st.text_area(
                            "Code",
                            value=block.get('content', ''),
                            height=170,
                            key=f"ta_{key_base}",
                            label_visibility="collapsed"
                        )

                        if st.button("▶️ 실행", key=f"run_{key_base}", type="primary"):
                            st.session_state[f"res_{key_base}"] = run_user_code(user_code)

                        res = st.session_state.get(f"res_{key_base}")
                        if res:
                            st.markdown("**실행결과**")
                            if res["ok"]:
                                render_output_box(res["output"])
                            else:
                                st.error(f"에러: {res['error']}")
                                if res["output"]:
                                    render_output_box(res["output"])

                    # 3) 연습문제 블록 (세로형: 코드박스 → 실행버튼 → 결과 → 정답/오답)
                    elif b_type == 'exercise_code':
                        title = block.get("title", "<연습해보기>")
                        prompt = block.get("prompt", "")
                        starter = block.get("starter", "")
                        expected = block.get("expected_output", "")
                        answer = block.get("answer", "")

                        st.markdown(f"### {title}")
                        st.markdown(prompt)

                        key_base = f"ex_{selected_chapter_title}_{index}"

                        user_code = st.text_area(
                            "Code",
                            value=starter,
                            height=170,
                            key=f"ta_{key_base}",
                            label_visibility="collapsed"
                        )

                        if st.button("▶️ 실행", key=f"run_{key_base}", type="primary"):
                            res = run_user_code(user_code)
                            st.session_state[f"res_{key_base}"] = res

                            # 채점: 출력 비교
                            if res["ok"]:
                                user_out = normalize_output(res["output"])
                                exp_out = normalize_output(expected)
                                st.session_state[f"grade_{key_base}"] = (user_out == exp_out)
                            else:
                                st.session_state[f"grade_{key_base}"] = False

                        res = st.session_state.get(f"res_{key_base}")
                        if res:
                            st.markdown("**실행결과**")
                            if res["ok"]:
                                render_output_box(res["output"])
                            else:
                                st.error(f"에러: {res['error']}")
                                if res["output"]:
                                    render_output_box(res["output"])

                            st.markdown("**채점결과**")
                            is_correct = st.session_state.get(f"grade_{key_base}")
                            if is_correct is True:
                                st.success("✅ 정답입니다!")
                            else:
                                st.error("❌ 오답입니다.")
                                st.caption(f"기대 출력: {expected}")

                        with st.expander("정답"):
                            st.code(answer, language="python")

                    # 4) 비디오 블록
                    elif b_type == 'video':
                        st.video(block.get('url'))
                        if 'caption' in block:
                            st.caption(block['caption'])

                    # 5) 이미지 블록
                    elif b_type == 'image':
                        st.image(block.get('url'), caption=block.get('caption', ''))

                    st.write("")
`;

      // ============================
      // stlite mount
      // ============================
      mount(
        {
          // iOS에서 무거워서 안 뜨면 아래처럼 경량화 가능:
          // requirements: isIOS ? [] : ["pandas", "matplotlib", "numpy"],

          // 지금은 요청대로 실행 가능하게 고정
          requirements: ["pandas", "matplotlib", "numpy"],

          entrypoint: "app.py",
          files: {
            "app.py": APP_PY,
            "data/menu.json": { url: "./data/menu.json" },
            "data/01_python.json": { url: "./data/01_python.json" },
            "data/02_data.json": { url: "./data/02_data.json" },
            "data/03_ai.json": { url: "./data/03_ai.json" }
          }
        },
        document.getElementById("root")
      );
    </script>
  </body>
</html>
