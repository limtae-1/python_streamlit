        background: #ffcccc;
        color: #cc0000;
        padding: 10px;
        border: 2px solid red;

        font-family: monospace;
        font-size: 12px;
        z-index: 9999;
        position: relative;
      }
    </style>

    <script>
      window.onerror = function (message, source, lineno) {
        var log = document.getElementById("error-log");
        if (log) {
          log.style.display = "block";
          log.textContent +=
            "Error: " + message + "\nLine: " + lineno + "\nSource: " + source + "\n\n";
        }
      };
      window.onunhandledrejection = function (event) {
        var log = document.getElementById("error-log");
        if (log) {
          log.style.display = "block";
          log.textContent += "Promise Error: " + event.reason + "\n\n";
        }
      };
    </script>
  </head>

  <body>
    <div id="error-log"></div>
    <div id="root"></div>

    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser/build/stlite.js";

      const isIOS =
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      const APP_PY = String.raw`
import streamlit as st
import json
import sys
from io import StringIO
import os
import builtins
import re

st.set_page_config(layout="wide", page_title="경문고등학교 실습실")

st.markdown("""
<style>
  .stTextArea textarea {
      background-color: #f0f2f6;
      font-family: 'Courier New', Courier, monospace;
      line-height: 1.5;
  }
  .output-box {
      background-color: #262730;
      color: #ffffff;
      padding: 10px;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      margin-top: 8px;
      margin-bottom: 10px;
      white-space: pre-wrap;
  }
  .small-hint {
      color: #6b7280;
      font-size: 0.85rem;
  }
</style>
""", unsafe_allow_html=True)

# ============================
# 유틸
# ============================
def normalize_output(s: str) -> str:
    return (s or "").replace("\\r\\n", "\\n").replace("\\r", "\\n").strip()

def render_output_box(output_text: str):
    text = output_text if output_text else "(출력 없음)"
    st.markdown(
        f"<div class='output-box'>{text.replace(chr(10), '<br>')}</div>",
        unsafe_allow_html=True
    )

def run_user_code(user_code: str, stdin_text: str = ""):
    old_stdout = sys.stdout
    redirected_output = StringIO()
    sys.stdout = redirected_output

    lines = (stdin_text or "").splitlines()
    it = iter(lines)

    old_input = builtins.input

    def fake_input(prompt: str = ""):
        # prompt를 출력에 남김(터미널 느낌)
        if prompt:
            redirected_output.write(str(prompt))
        try:
            return next(it)
        except StopIteration:
            raise EOFError("입력이 부족합니다. (입력칸에 줄 단위로 값을 추가하세요.)")

    builtins.input = fake_input
    try:
        exec(user_code, {})
        return {"ok": True, "output": redirected_output.getvalue(), "error": None}
    except Exception as e:
        return {"ok": False, "output": redirected_output.getvalue(), "error": str(e)}
    finally:
        builtins.input = old_input
        sys.stdout = old_stdout

def load_json(filepath):
    try:
        with open(filepath, 'r', encoding='utf-8') as f:
            return json.load(f)
    except Exception:
        return []

def safe_id(text: str) -> str:
    # key 충돌 방지용: 공백/특수문자 제거
    text = text or ""
    text = re.sub(r"\\s+", "_", text.strip())
    text = re.sub(r"[^0-9a-zA-Z가-힣_\\-]", "", text)
    return text[:60] if len(text) > 60 else text

# ============================
# 공통 렌더러 (중복 최소화)
# ============================
def render_code_like_block(
    block: dict,
    key_base: str,
    *,
    with_input: bool,
    with_grading: bool
):
    """
    UI: 코드박스 → (선택)입력칸 → 실행버튼 → 실행결과 → (선택)정답/오답 → (선택)정답 보기
    """
    guide = block.get('guide', '아래 코드를 실행해보세요.')
    st.info(guide)

    # 코드: exercise 계열이면 starter 우선, 아니면 content
    default_code = block.get('starter', block.get('content', ''))
    user_code = st.text_area(
        "Code",
        value=default_code,
        height=170,
        key=f"ta_{key_base}",
        label_visibility="collapsed"
    )

    stdin_text = ""
    if with_input:
        stdin_text = st.text_area(
            "입력(여러 줄 가능)",
            value=block.get('stdin', ''),
            height=90,
            key=f"in_{key_base}",
            help="input()이 여러 번 나오면, 입력값을 줄바꿈으로 여러 줄 입력하세요. 예) 3\\n5"
        )
    else:
        st.markdown("<div class='small-hint'>입력이 필요 없는 실습입니다.</div>", unsafe_allow_html=True)

    # 실행
    if st.button("▶️ 실행", key=f"run_{key_base}", type="primary"):
        res = run_user_code(user_code, stdin_text)
        st.session_state[f"res_{key_base}"] = res

        # 채점(출력 비교)
        if with_grading:
            expected = block.get("expected_output", "")
            if res["ok"]:
                user_out = normalize_output(res["output"])
                exp_out = normalize_output(expected)
                st.session_state[f"grade_{key_base}"] = (user_out == exp_out)
            else:
                st.session_state[f"grade_{key_base}"] = False

    # 결과 표시
    res = st.session_state.get(f"res_{key_base}")
    if res:
        st.markdown("**실행결과**")
        if res["ok"]:
            render_output_box(res["output"])
        else:
            st.error(f"에러: {res['error']}")
            if res["output"]:
                render_output_box(res["output"])

        # 채점 결과
        if with_grading:
            expected = block.get("expected_output", "")
            st.markdown("**채점결과**")
            is_correct = st.session_state.get(f"grade_{key_base}")
            if is_correct is True:
                st.success("✅ 정답입니다!")
            else:
                st.error("❌ 오답입니다.")
                st.caption(f"기대 출력: {expected}")

    # 정답 보기 (exercise 계열만)
    if with_grading:
        answer = block.get("answer", "")
        with st.expander("정답"):
            st.code(answer, language="python")

# ============================
# 사이드바 메뉴
# ============================
st.sidebar.title("🐍 정보 수업 실습실")
st.sidebar.header("학습 주제 선택")

menu_data = load_json("data/menu.json")

if not menu_data:
    st.sidebar.error("메뉴 데이터(data/menu.json)가 없습니다.")
else:
    menu_options = {item['title']: item for item in menu_data}
    selected_main_title = st.sidebar.selectbox("대단원 선택", list(menu_options.keys()))

    if selected_main_title:
        selected_file = menu_options[selected_main_title]['file']
        chapter_data = load_json(os.path.join("data", selected_file))

        if not chapter_data:
            st.error(f"{selected_file} 파일을 읽을 수 없습니다.")
        else:
            chapter_titles = [item['sub_title'] for item in chapter_data]
            selected_chapter_title = st.sidebar.selectbox("학습 내용 선택", chapter_titles)

            current_chapter = next((item for item in chapter_data if item['sub_title'] == selected_chapter_title), None)

            if current_chapter:
                st.header(f"📝 {current_chapter['sub_title']}")
                st.divider()

                # chapter_id는 key 안정성(키 충돌 방지)에 중요
                chapter_id = safe_id(current_chapter.get("sub_title", selected_chapter_title))

                blocks = current_chapter.get('blocks', [])

                for index, block in enumerate(blocks):
                    b_type = block.get('type', 'text')

                    # ✅ key_base: 타입 + 챕터 + 인덱스로 충돌 방지
                    key_base = f"{b_type}_{chapter_id}_{index}"
                    #아래는 초기 텍스트 파일 상자
                    #if b_type == 'text':
                    #    st.markdown(block.get('content', ''))
                    
                    #아래는 줄바꿈 lines를 추가한 기능
                    if b_type == 'text':
                        if 'lines' in block:
                            st.markdown("\n".join(block.get('lines', [])))
                        else:
                            st.markdown(block.get('content', ''))

                    # 입력 없음 / 채점 없음
                    elif b_type == 'code':
                        render_code_like_block(block, key_base, with_input=False, with_grading=False)

                    # 입력 있음 / 채점 없음
                    elif b_type == 'code_input':
                        render_code_like_block(block, key_base, with_input=True, with_grading=False)

                    # 입력 없음 / 채점 있음
                    elif b_type == 'exercise_code':
                        # exercise는 안내 텍스트(title/prompt)를 위에 표시
                        title = block.get("title", "<연습해보기>")
                        prompt = block.get("prompt", "")
                        st.markdown(f"### {title}")
                        if prompt:
                            st.markdown(prompt)
                        render_code_like_block(block, key_base, with_input=False, with_grading=True)

                    # 입력 있음 / 채점 있음
                    elif b_type == 'exercise_code_input':
                        title = block.get("title", "<연습해보기>")
                        prompt = block.get("prompt", "")
                        st.markdown(f"### {title}")
                        if prompt:
                            st.markdown(prompt)
                        render_code_like_block(block, key_base, with_input=True, with_grading=True)

                    elif b_type == 'video':
                        st.video(block.get('url'))
                        if 'caption' in block:
                            st.caption(block['caption'])

                    elif b_type == 'image':
                        st.image(block.get('url'), caption=block.get('caption', ''))

                    st.write("")
`;

      mount(
        {
          // iOS에서 무거워서 안 뜨면 아래로 바꾸세요:
          // requirements: isIOS ? [] : ["pandas", "matplotlib", "numpy"],
          requirements: ["pandas", "matplotlib", "numpy", "scikit-learn"],
          entrypoint: "app.py",
          files: {
            "app.py": APP_PY,
            "data/menu.json": { url: "./data/menu.json" },
            "data/01_python.json": { url: "./data/01_python.json" },
            "data/02_data.json": { url: "./data/02_data.json" },
            "data/03_ai.json": { url: "./data/03_ai.json" },
            "data/04_turtle.json": { url: "./data/04_turtle.json" }
          }
        },
        document.getElementById("root")
      );
    </script>
  </body>
