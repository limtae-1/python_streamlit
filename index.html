<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>정보 수업 파이썬 실습실</title>
    
    <style>
      #error-log {
        display: none; /* 평소에는 숨김 */
        background: #ffcccc;
        color: #cc0000;
        padding: 10px;
        border: 2px solid red;
        margin: 10px;
        white-space: pre-wrap;
        font-family: monospace;
        font-size: 12px;
        z-index: 9999;
        position: relative;
      }
    </style>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        var log = document.getElementById('error-log');
        log.style.display = 'block';
        log.innerHTML += "Error: " + message + "\nLine: " + lineno + "\nSource: " + source + "\n\n";
      };
      window.onunhandledrejection = function(event) {
        var log = document.getElementById('error-log');
        log.style.display = 'block';
        log.innerHTML += "Promise Error: " + event.reason + "\n\n";
      };
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.53.0/build/stlite.js"></script>
  </head>
  <body>
    <div id="error-log"></div>
    
    <div id="root"></div>
    <script>
      stlite.mount({
        /* [테스트 1] 만약 아이폰에서 계속 멈춘다면 아래 requirements를 비워보세요. 
           메모리 부족 문제인지 확인하기 위함입니다.
           requirements: [], 
        */
        requirements: ["pandas", "matplotlib", "numpy"], 
        entrypoint: "app.py", 
        files: {
          "app.py": `
import streamlit as st
import json
import sys
from io import StringIO
import os

st.set_page_config(layout="wide", page_title="정보 수업 파이썬 실습")

st.markdown("""
<style>
    .stTextArea textarea { background-color: #f0f2f6; font-family: 'Courier New'; }
    .output-box { background-color: #262730; color: white; padding: 10px; border-radius: 5px; }
</style>
""", unsafe_allow_html=True)

def load_json(filepath):
    try:
        with open(filepath, 'r', encoding='utf-8') as f:
            return json.load(f)
    except Exception:
        return []

st.sidebar.title("🐍 정보 수업")
st.sidebar.header("학습 주제 선택")

menu_data = load_json("data/menu.json")

if not menu_data:
    st.sidebar.warning("메뉴 로딩 중...") # 로딩 중 표시
else:
    menu_options = {item['title']: item for item in menu_data}
    selected_main_title = st.sidebar.selectbox("대단원 선택", list(menu_options.keys()))

    if selected_main_title:
        selected_file = menu_options[selected_main_title]['file']
        chapter_data = load_json(os.path.join("data", selected_file))
        
        if chapter_data:
            chapter_titles = [item['sub_title'] for item in chapter_data]
            selected_chapter_title = st.sidebar.selectbox("학습 내용 선택", chapter_titles)
            
            current_chapter = next((item for item in chapter_data if item['sub_title'] == selected_chapter_title), None)

            if current_chapter:
                st.header(f"📝 {current_chapter['sub_title']}")
                st.divider()

                blocks = current_chapter.get('blocks', [])
                for index, block in enumerate(blocks):
                    b_type = block.get('type', 'text')
                    
                    if b_type == 'text':
                        st.markdown(block.get('content', ''))

                    elif b_type == 'code':
                        st.info(block.get('guide', '실습 코드'))
                        col1, col2 = st.columns([1, 1])
                        unique_key = f"ed_{selected_chapter_title}_{index}"
                        
                        with col1:
                            user_code = st.text_area("Code", value=block.get('content', ''), height=200, key=unique_key)
                            if st.button("▶️ 실행", key=f"btn_{unique_key}", type="primary"):
                                with col2:
                                    old_stdout = sys.stdout
                                    sys.stdout = redirected_output = StringIO()
                                    try:
                                        exec(user_code)
                                        st.markdown(f"<div class='output-box'>{redirected_output.getvalue().replace(chr(10), '<br>')}</div>", unsafe_allow_html=True)
                                    except Exception as e:
                                        st.error(f"에러: {e}")
                                    finally:
                                        sys.stdout = old_stdout

                    elif b_type == 'video':
                        st.video(block.get('url'))
                    
                    elif b_type == 'image':
                        st.image(block.get('url'))
                    
                    st.write("") 
`,
          "data/menu.json": { url: "./data/menu.json" },
          "data/01_python.json": { url: "./data/01_python.json" },
          "data/02_data.json": { url: "./data/02_data.json" },
          "data/03_ai.json": { url: "./data/03_ai.json" }
        },
      }, document.getElementById("root"));
    </script>
  </body>
</html>
