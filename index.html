<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>파이썬 출력 명령어 수업</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.31.0/build/stlite.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.31.0/build/stlite.js"></script>
    <script>
      stlite.mount({
        requirements: [], // 추가 라이브러리가 필요하면 여기에 작성 (예: pandas)
        entrypoint: "app.py",
        files: {
          "app.py": `
import streamlit as st

st.markdown("### :orange[출력명령어를 알아보자!]")

st.subheader("출력명령어 print()")
st.markdown("""
* Python 언어에서 화면에 출력을 하는 명령어는 **print()** 명령어이다.
* **문자를 출력**하기 위해선 (큰, 작은) 따옴표로 감싸주어야 한다.
""")

# 실습 섹션
user_input = st.text_input("연습: 'kyungmoon'을 출력해보세요", placeholder="print('...')")

if user_input:
    if "kyungmoon" in user_input:
        st.success("참 잘했어요! 🎉")
    else:
        st.error("다시 한번 확인해볼까요?")
          `,
        },
      }, document.getElementById("root"));
    </script>
  </body>
</html>
