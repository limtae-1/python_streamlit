<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>정보 수업 파이썬 실습실</title>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.53.0/build/stlite.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      stlite.mount({
        requirements: ["pandas", "matplotlib", "numpy"], 
        entrypoint: "app.py", 
        files: {
          "app.py": `
import streamlit as st
import json
import sys
from io import StringIO
import os

st.set_page_config(layout="wide", page_title="정보 수업 파이썬 실습")

# --- CSS 스타일링 ---
st.markdown("""
<style>
    .stTextArea textarea {
        background-color: #f0f2f6;
        font-family: 'Courier New', Courier, monospace;
        line-height: 1.5;
    }
    .output-box {
        background-color: #262730;
        color: #ffffff;
        padding: 10px;
        border-radius: 5px;
        font-family: 'Courier New', monospace;
        margin-top: 10px;
    }
    .block-container {
        padding-top: 2rem;
    }
</style>
""", unsafe_allow_html=True)

# --- 데이터 로드 함수 ---
def load_json(filepath):
    try:
        with open(filepath, 'r', encoding='utf-8') as f:
            return json.load(f)
    except Exception:
        return []

# --- 사이드바 (메뉴) ---
st.sidebar.title("🐍 정보 수업 실습실")
st.sidebar.header("학습 주제 선택")

menu_data = load_json("data/menu.json")

if not menu_data:
    st.sidebar.error("메뉴 데이터(data/menu.json)가 없습니다.")
else:
    # 1. 대단원 선택
    menu_options = {item['title']: item for item in menu_data}
    selected_main_title = st.sidebar.selectbox("대단원 선택", list(menu_options.keys()))

    if selected_main_title:
        selected_file = menu_options[selected_main_title]['file']
        chapter_data = load_json(os.path.join("data", selected_file))
        
        if not chapter_data:
             st.error(f"{selected_file} 파일을 읽을 수 없습니다.")
        else:
            # 2. 소단원(챕터) 선택
            chapter_titles = [item['sub_title'] for item in chapter_data]
            selected_chapter_title = st.sidebar.selectbox("학습 내용 선택", chapter_titles)
            
            # 현재 선택된 챕터 데이터 가져오기
            current_chapter = next((item for item in chapter_data if item['sub_title'] == selected_chapter_title), None)

            # --- 메인 화면 렌더링 (블록 조립 방식) ---
            if current_chapter:
                st.header(f"📝 {current_chapter['sub_title']}")
                st.divider()

                # 'blocks' 리스트가 있는지 확인 (없으면 구버전 호환 또는 빈화면)
                blocks = current_chapter.get('blocks', [])

                # 블록 하나씩 순서대로 그리기
                for index, block in enumerate(blocks):
                    b_type = block.get('type', 'text')
                    
                    # 1) 텍스트(Markdown) 블록
                    if b_type == 'text':
                        st.markdown(block.get('content', ''))

                    # 2) 코드 에디터 블록
                    elif b_type == 'code':
                        st.info(block.get('guide', '아래 코드를 실행해보세요.')) # 가이드 문구
                        
                        col1, col2 = st.columns([1, 1])
                        
                        # 중요: 위젯마다 고유한 key가 필요하므로 index를 활용함
                        unique_key = f"editor_{selected_chapter_title}_{index}"
                        
                        with col1:
                            user_code = st.text_area(
                                "Code", 
                                value=block.get('content', ''),
                                height=200,
                                key=unique_key,
                                label_visibility="collapsed"
                            )
                            # 실행 버튼
                            if st.button("▶️ 실행하기", key=f"btn_{unique_key}", type="primary"):
                                with col2:
                                    old_stdout = sys.stdout
                                    redirected_output = StringIO()
                                    sys.stdout = redirected_output
                                    try:
                                        exec(user_code)
                                        output = redirected_output.getvalue()
                                        if output:
                                            st.markdown(f"<div class='output-box'>{output.replace(chr(10), '<br>')}</div>", unsafe_allow_html=True)
                                        else:
                                            st.warning("출력 결과가 없습니다.")
                                    except Exception as e:
                                        st.error(f"에러 발생:\\n{e}")
                                    finally:
                                        sys.stdout = old_stdout
                        
                        # 오른쪽 컬럼(결과창) 안내 문구 (실행 전)
                        with col2:
                            if f"btn_{unique_key}" not in st.session_state or not st.session_state[f"btn_{unique_key}"]:
                                st.caption("👈 실행 버튼을 누르면 결과가 여기에 표시됩니다.")

                    # 3) 비디오 블록
                    elif b_type == 'video':
                        st.video(block.get('url'))
                        if 'caption' in block:
                            st.caption(block['caption'])

                    # 4) 이미지 블록
                    elif b_type == 'image':
                        st.image(block.get('url'), caption=block.get('caption', ''))
                    
                    # 블록 간 간격 추가
                    st.write("") 
                    st.write("") 
`,
          "data/menu.json": {
            url: "./data/menu.json",
          },
          "data/01_python.json": {
            url: "./data/01_python.json",
          },
          "data/02_data.json": {
            url: "./data/02_data.json",
          },
          "data/03_ai.json": {
            url: "./data/03_ai.json",
          }
        },
      }, document.getElementById("root"));
    </script>
  </body>
</html>
